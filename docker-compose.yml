services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # override .env's REDIS_HOST/PORT — inside this container, Redis
      # is only reachable at the service name "redis", never localhost
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    # no ports: — reachable only from other containers on this
    # compose network (i.e. web), not from the host or outside
